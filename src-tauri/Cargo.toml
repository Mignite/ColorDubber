[package]
name = "colordubber-ai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "colordubber-ai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "colordubber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "calibrar"
path = "bin/calibrar.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "wav"] }
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
whisper-rs = { version = "0.16", features = ["vulkan"] }
polyvoice = { version = "0.12", features = ["onnx", "download", "segmentation", "embedder", "clusterer", "resegmentation"] }
unicode-segmentation = "1.13.3"

