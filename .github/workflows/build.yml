name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instala deps del WebView (cargo check las necesita)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  release:
    # Solo en tags: crea el Release con los instaladores adjuntos.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instala deps del WebView (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # El plugin linuxdeploy de gstreamer (bundleMediaFramework) copia los
      # plugins del sistema de build: sin estos paquetes aborta con
      # "could not find plugins directory". patchelf lo exige tambien.
      - name: Instala GStreamer + patchelf (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          patchelf
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
          gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ColorDubber ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
