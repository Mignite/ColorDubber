name: Build Tauri

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle_glob: |
              C:/t/debug/release/bundle/**
              C:/t/release/bundle/**
              src-tauri/target/release/bundle/**
            cmake_args: -DGGML_VULKAN_SHADERS_GEN_EXTERNAL=OFF
          - os: ubuntu-22.04
            platform: linux
            bundle_glob: |
              src-tauri/target/release/bundle/**
            cmake_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # C:/t/debug en Windows no está bajo src-tauri/target — cachea ambos
          workspaces: |
            src-tauri -> target
          cache-all-crates: true

      # ── Deps del sistema ──────────────────────────────────────────
      - name: Install Tauri deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake

      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools shaderc spirv-tools vulkan-tools
          vulkaninfo --summary || echo "::warning::vulkaninfo no disponible, pero headers instalados"
          which glslc || which glslangValidator || echo "::warning::glslc no en PATH"
          glslc --version 2>&1 || glslangValidator --version 2>&1 || echo "::warning::glslc/glslangValidator no encontrado"
          # FindVulkan busca glslc, shaderc lo provee; si no está, creamos symlink
          if [ ! -x /usr/bin/glslc ] && [ -x /usr/bin/glslangValidator ]; then
            echo "Creando symlink glslc -> glslangValidator"
            sudo ln -sf /usr/bin/glslangValidator /usr/bin/glslc || true
          fi
          ls -l /usr/bin/glslc* 2>&1 || true

      - name: Setup Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-use-cache: true
        continue-on-error: false

      # ── Fix .cargo/config.toml (solo Windows) ────────────────────
      - name: Fix cargo target-dir for Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          # .cargo/config.toml fija target-dir = "C:/t/debug" (Windows, evita path-too-long
          # con whisper-rs-sys + Vulkan SDK). En Linux esa ruta no existe y rompe el build.
          # Lo neutralizamos: o lo borramos o sobreescribimos CARGO_TARGET_DIR.
          if [ -f .cargo/config.toml ]; then
            echo "Removiendo .cargo/config.toml (solo válido en Windows)"
            rm .cargo/config.toml
          fi
          echo "CARGO_TARGET_DIR=src-tauri/target" >> "$GITHUB_ENV"

      # ── Frontend ─────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci

      # ── Build ────────────────────────────────────────────────────
      - name: Build Tauri (Windows)
        if: matrix.platform == 'windows'
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: npm run tauri:build:release
        # Equivale a: cross-env CMAKE_ARGS=-DGGML_VULKAN_SHADERS_GEN_EXTERNAL=OFF tauri build
        # Ese flag evita que ggml-vulkan genere shaders externos (necesita glslc en build-time
        # de forma distinta); sin él el build de whisper-rs-sys falla en Windows.

      - name: Build Tauri (Linux)
        if: matrix.platform == 'linux'
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: npx tauri build

      # ── Artifacts ────────────────────────────────────────────────
      - name: Upload bundle (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: |
            C:/t/debug/release/bundle/**
            C:/t/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bundle (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
